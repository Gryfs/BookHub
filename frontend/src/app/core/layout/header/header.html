<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/books" (click)="closeMenu()">Book<span>Hub</span></a>

    <button
      type="button"
      class="menu-button"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      ≡ Menu
    </button>

    <nav id="main-nav" aria-label="Navigation principale" [class.open]="menuOpen()">
      @if (session.isLoggedIn()) {
        <a [routerLink]="session.homeUrl()" routerLinkActive="active" (click)="closeMenu()">{{
          homeLabel()
        }}</a>
      }
      <a
        routerLink="/books"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >Catalogue</a
      >
      <a routerLink="/books/search" routerLinkActive="active" (click)="closeMenu()">Recherche</a>
      @if (session.isLoggedIn()) {
        <a routerLink="/loans" routerLinkActive="active" (click)="closeMenu()">Mes emprunts</a>
        <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">Profil</a>
      }
    </nav>

    <div class="account" [class.open]="menuOpen()">
      @if (session.user(); as user) {
        <span class="user-name">{{ displayName() }} · {{ user.role }}</span>
        <button type="button" class="btn btn-light" (click)="logout()">Déconnexion</button>
      } @else {
        <span class="visitor">Visiteur</span>
        <a class="btn btn-light" routerLink="/login" (click)="closeMenu()">Connexion</a>
        <a class="btn btn-accent" routerLink="/register" (click)="closeMenu()">Inscription</a>
      }
    </div>
  </div>
</header>
