spring:
  # Variables locales (non commitées) : backend/.env au format NOM=valeur
  config:
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    fr.eni.bookhub: DEBUG
    org.hibernate.SQL: DEBUG
